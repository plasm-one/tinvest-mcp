name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      # The suite is offline by design: no token, no network. If this step ever
      # needs a secret, the test is wrong — see CONTRIBUTING.md.
      - name: Test
        run: uv run pytest --cov=tinvest_mcp --cov-report=term-missing

      - name: Doctor runs on a bare checkout
        run: uv run tinvest-mcp-doctor || true

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: |
          uv tool run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  secrets-scan:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A T-Invest token starts with "t." followed by a long base64-ish body.
      # This catches the accident that matters most in this repository: a real
      # token pasted into a doc, a test fixture, or an example config.
      - name: Grep for T-Invest-shaped tokens
        run: |
          if grep -rInE '\bt\.[A-Za-z0-9_-]{40,}' \
               --exclude-dir=.git \
               --exclude-dir=.github \
               . ; then
            echo "::error::A string shaped like a real T-Invest token is committed. Revoke it now at https://www.tbank.ru/invest/settings/api/ and remove it from history."
            exit 1
          fi
          echo "No token-shaped strings found."

      - name: No .env committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked. Remove it from the index and revoke any token it held."
            exit 1
          fi
          echo ".env is not tracked."
