[project]
name = "tinvest-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the T-Bank Invest (T-Invest) brokerage API — AI wealth management infrastructure: research, risk-checked order previews, gated execution."
readme = "README.en.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Plasm", email = "alex@plasm.one" }]
maintainers = [{ name = "Plasm", email = "alex@plasm.one" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "tinkoff", "tinkoff-investments", "t-invest", "tbank",
    "brokerage", "investing", "llm", "ai-agent",
    "wealth-management", "ai-wealth-management", "autonomous-finance",
    "portfolio", "rebalancing", "risk-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.12.4",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.1",
    "certifi>=2024.0.0",
    # The T-Invest gRPC SDK. `tinvest_mcp.sdk` imports `t_tech.invest` and falls
    # back to the legacy `tinkoff.invest`, so either package satisfies the
    # server — see docs/installation.md if your index cannot serve this one.
    "t-tech-investments>=1.49.1",
]

[project.optional-dependencies]
# Pretty stderr logs. Plain stdlib logging is used when absent.
logging = ["loguru>=0.7.3"]
# Local Swagger UI over the same service layer, for manual poking. Never expose.
debug-api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://plasm.one"
Repository = "https://github.com/plasm-one/tinvest-mcp"
Issues = "https://github.com/plasm-one/tinvest-mcp/issues"
Changelog = "https://github.com/plasm-one/tinvest-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/plasm-one/tinvest-mcp/blob/main/SECURITY.md"

[project.scripts]
tinvest-mcp = "tinvest_mcp.server:main"
tinvest-mcp-doctor = "tinvest_mcp.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0",
    "ruff>=0.14.0",
    "loguru>=0.7.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinvest_mcp"]
artifacts = ["src/tinvest_mcp/certs/*.pem"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tinvest_mcp",
    "tests",
    "docs",
    "README.md",
    "README.en.md",
    "SECURITY.md",
    "DISCLAIMER.md",
    "LICENSE",
    "CHANGELOG.md",
    "config.toml.example",
    ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# conftest must extend sys.path before importing pytest; a couple of tests
# assert that *something* raises, which is the point of the test.
"tests/*" = ["E402", "B017"]

# Uncomment to install the SDK from a locally vendored wheel instead of an
# index. See docs/installation.md → "If the SDK will not install".
# [tool.uv.sources]
# t-tech-investments = { path = "vendor/t_tech_investments-1.49.1-py3-none-any.whl" }
